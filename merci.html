<!doctype html>
<html lang="fr" data-lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Merci — Génie Culturel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preload" href="assets/fonts/SpaceGrotesk-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Space Grotesk";src:url(assets/fonts/SpaceGrotesk-VariableFont_wght.ttf) format("truetype");font-weight:300 700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Space Grotesk",system-ui,sans-serif;background:#0d0d0d;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
.box{max-width:420px}
h1{margin:0 0 12px;font-size:clamp(1.6rem,4vw,2rem);font-weight:700;letter-spacing:.02em}
p{margin:0;color:#a9a9a9;font-size:1.05rem;line-height:1.5}
</style>
</head>
<body>
  <div class="box" role="status" aria-live="polite">
    <h1><span lang="fr">Merci !</span><span lang="en" hidden>Thank you!</span></h1>
    <p lang="fr">Nous avons bien reçu votre demande.<br>Nous revenons vers vous très vite.</p>
    <p lang="en" hidden>We have received your message.<br>We will get back to you very soon.</p>
  </div>
<script>
(function(){
  var embedded = window.parent && window.parent !== window;
  var CLOSE_MS = 5000;
  function notifyClose(){
    try{
      if(embedded){
        window.parent.postMessage({type:'gc-contact-close'}, '*');
      }
    }catch(e){}
  }
  setTimeout(notifyClose, CLOSE_MS);
})();
</script>
</body>
</html>
